<svg width="420" height="96" viewBox="0 0 420 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">EarlyDrop logo</title>
  <desc id="description">A navy and teal student-support icon beside the black EarlyDrop wordmark.</desc>

  <defs>
    <linearGradient id="markGradient" x1="10" y1="8" x2="86" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183B56"/>
      <stop offset="1" stop-color="#087F7A"/>
    </linearGradient>
  </defs>

  <!-- Icon: an upward route inside a rounded learning badge. -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#markGradient)"/>
  <path d="M24 29.5L48 18L72 29.5L48 41L24 29.5Z" fill="white"/>
  <path d="M31 37.5V53.5C31 58.5 38.6 62.5 48 62.5C57.4 62.5 65 58.5 65 53.5V37.5L48 45.5L31 37.5Z" fill="white" fill-opacity="0.95"/>
  <path d="M72 30V48" stroke="#8DE0D7" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="72" cy="51.5" r="3.5" fill="#8DE0D7"/>
  <path d="M40 53.5L45.2 48.3L49.2 52.3L58.5 43" stroke="#087F7A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="112" y="61" fill="#111111" font-family="Inter, Arial, Helvetica, sans-serif" font-size="46" font-weight="750" letter-spacing="-1.8">EarlyDrop</text>
</svg>
